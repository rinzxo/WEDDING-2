<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meja Resepsionis - QR Scanner Presensi Tamu</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/admin.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 10%, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .scanner-app {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .scanner-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .scanner-box {
      background: #0f172a;
      border: 2px solid var(--admin-gold);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      min-height: 300px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="scanner-app">
    <div class="scanner-header">
      <div style="font-family: 'Cinzel', serif; font-size: 1.4rem; font-weight: 700; color: var(--admin-gold);">HABIB &amp; ADIBA</div>
      <h1 style="font-size: 1.1rem; font-weight: 700; margin-top: 4px;">Meja Resepsionis &bull; Presensi Tamu</h1>
      <p style="font-size: 0.78rem; color: #94a3b8;">Arahkan kamera ke QR Code pada kartu undangan tamu.</p>
    </div>

    <!-- Scanner Camera Viewport -->
    <div class="scanner-box">
      <div id="reader" style="width: 100%;"></div>
      <div id="cameraPrompt" style="padding: 40px 20px; text-align: center;">
        <i data-lucide="camera" style="width: 50px; height: 50px; color: var(--admin-gold); margin-bottom: 15px;"></i>
        <h3 style="font-size: 1.1rem; margin-bottom: 8px;">Kamera Siap Dinyalakan</h3>
        <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 20px;">Gunakan kamera ponsel atau tablet untuk presensi cepat tamu undangan.</p>
        <button id="btnStartCam" class="btn-primary" style="margin: 0 auto;" onclick="startReceptionScanner()">
          <i data-lucide="video" style="width: 16px; height: 16px;"></i>
          <span>Mulai Pemindai</span>
        </button>
      </div>
    </div>

    <!-- Live Scan Result Card -->
    <div id="scanResultCard" style="display: none; margin-top: 18px; border-radius: 16px; padding: 20px; background: #ffffff; color: #1e293b; box-shadow: 0 8px 25px rgba(0,0,0,0.3);">
      <div id="scanResultInner"></div>
    </div>

    <!-- Manual Code Fallback -->
    <div style="margin-top: 20px; background: rgba(255, 255, 255, 0.05); padding: 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1);">
      <label style="font-size: 0.8rem; font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 6px;">Input Kode / Nama Manual:</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="manualInput" class="input-admin" placeholder="Contoh: GUEST-8A1B atau nama tamu..." style="background: #1e293b; color: #ffffff; border-color: #334155;">
        <button class="btn-primary" onclick="submitManualCode()">Check-In</button>
      </div>
    </div>

    <!-- Live Arrival Feed -->
    <div style="margin-top: 20px; flex: 1;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-size: 0.85rem; font-weight: 700; color: var(--admin-gold);">Tamu Baru Hadir Hari Ini</span>
        <span id="receptionCount" style="font-size: 0.75rem; background: rgba(215, 172, 100, 0.2); color: var(--admin-gold); padding: 3px 10px; border-radius: 20px; font-weight: 700;">0 Hadir</span>
      </div>
      <div id="receptionLogList" style="display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto;">
        <!-- Log items -->
      </div>
    </div>

    <!-- Bottom links -->
    <div style="text-align: center; margin-top: 20px; font-size: 0.78rem;">
      <a href="/admin" style="color: var(--admin-gold); text-decoration: none; margin-right: 15px;">&larr; Buka Dashboard Admin</a>
      <a href="/" target="_blank" style="color: #94a3b8; text-decoration: none;">Lihat Undangan Publik</a>
    </div>
  </div>

  <script src="/vendor/lucide.min.js"></script>
  <script src="/vendor/html5-qrcode.min.js"></script>
  <script>
    let scanner = null;
    let scanCooldown = false;

    function playChime(success = true) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (success) {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(880.00, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.35);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, ctx.currentTime);
          osc.frequency.setValueAtTime(240, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch (e) {}
    }

    function startReceptionScanner() {
      document.getElementById('cameraPrompt').style.display = 'none';
      scanner = new Html5Qrcode('reader');
      scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        (code) => {
          if (scanCooldown) return;
          scanCooldown = true;
          setTimeout(() => { scanCooldown = false; }, 2500);
          processCheckIn(code.trim());
        },
        () => {}
      ).catch(err => {
        alert('Gagal membuka kamera: ' + err);
        document.getElementById('cameraPrompt').style.display = 'block';
      });
    }

    async function submitManualCode() {
      const code = document.getElementById('manualInput').value.trim();
      if (!code) return alert('Masukkan kode atau nama tamu');
      await processCheckIn(code);
      document.getElementById('manualInput').value = '';
    }

    async function processCheckIn(code) {
      const card = document.getElementById('scanResultCard');
      const inner = document.getElementById('scanResultInner');
      card.style.display = 'block';

      try {
        const res = await fetch('/api/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();

        if (data.success) {
          playChime(true);
          card.style.border = '2px solid #16a34a';
          card.style.background = '#f0fdf4';
          inner.innerHTML = `
            <div style="font-size: 0.75rem; font-weight: 700; color: #16a34a; text-transform: uppercase;">CHECK-IN BERHASIL</div>
            <h2 style="font-size: 1.4rem; font-weight: 800; color: #1e293b; margin: 4px 0;">${data.guest.name}</h2>
            <div style="font-size: 0.85rem; color: #64748b;">
              Kategori: <strong>${data.guest.category}</strong> | Kuota: <strong>${data.guest.paxActual || data.guest.pax} Pax</strong> | Jam: <strong>${new Date().toLocaleTimeString('id-ID')} WIB</strong>
            </div>
          `;
          loadRecentLogs();
        } else if (data.alreadyCheckedIn) {
          playChime(false);
          card.style.border = '2px solid #f59e0b';
          card.style.background = '#fffbeb';
          inner.innerHTML = `
            <div style="font-size: 0.75rem; font-weight: 700; color: #d97706; text-transform: uppercase;">SUDAH PERNAH CHECK-IN</div>
            <h2 style="font-size: 1.3rem; font-weight: 800; color: #1e293b; margin: 4px 0;">${data.guest.name}</h2>
            <div style="font-size: 0.85rem; color: #92400e;">
              Tamu ini sudah tercatat check-in pada pukul <strong>${new Date(data.checkedInAt).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} WIB</strong>.
            </div>
          `;
        } else {
          playChime(false);
          card.style.border = '2px solid #dc2626';
          card.style.background = '#fef2f2';
          inner.innerHTML = `
            <div style="font-size: 0.75rem; font-weight: 700; color: #dc2626; text-transform: uppercase;">KODE TIDAK DITEMUKAN</div>
            <h2 style="font-size: 1.2rem; font-weight: 700; color: #1e293b; margin: 4px 0;">Tamu Tidak Terdaftar</h2>
            <div style="font-size: 0.82rem; color: #991b1b;">Kode: <code>${code}</code> tidak ditemukan di database.</div>
          `;
        }
      } catch (err) {
        alert('Koneksi server terganggu');
      }
    }

    async function loadRecentLogs() {
      try {
        const res = await fetch('/api/guest/ibu-siti-rahma'); // ping check
        const statsRes = await fetch('/api/wishes'); // public endpoint
        // Let's fetch guest data or wishes
      } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
